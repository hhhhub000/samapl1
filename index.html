<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>こんにちは</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: #f4f7fb;
        color: #1f2937;
      }

      .hello {
        font-size: clamp(2rem, 6vw, 5rem);
        font-weight: 700;
        letter-spacing: 0.08em;
        color: #2563eb;
        text-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
      }
    </style>
  </head>
  <body>
    <div class="hello">こんにちは</div>
  </body>
</html>
